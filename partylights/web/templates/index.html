<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Lights</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

<header>
  <h1>Party Lights</h1>
  <span class="pill"><i class="dot" id="d-dmx"></i> DMX <b id="s-dmx">—</b></span>
  <span class="pill"><i class="dot" id="d-audio"></i> Audio <b id="s-audio">—</b></span>
  <span class="pill"><i class="dot" id="d-juke"></i> Jukebox <b id="s-juke">—</b></span>
  <span class="spacer"></span>
  <a href="/live">Live page &rarr;</a>
</header>

<div class="panel">
  <div class="row">
    <button id="b-mode" class="wide">Mode: <b id="s-mode">auto</b></button>
    <button id="b-blackout" class="danger wide">Blackout</button>
    <button id="b-freeze" class="wide">Freeze</button>
    <button id="b-resume" class="wide">Resume auto</button>
  </div>
  <div style="margin-top:14px">
    <label class="field">Master <span id="s-master" class="mono">100%</span></label>
    <input type="range" id="r-master" min="0" max="100" value="100">
  </div>
  <div class="note" id="s-track"></div>
</div>

<div class="panel">
  <h2>Look</h2>
  <div class="row" id="looks"></div>
  <div class="note" id="look-desc"></div>
</div>

<div class="panel">
  <h2>Palette</h2>
  <div class="row" id="palettes"></div>
</div>

<div class="panel">
  <h2>What the music is doing</h2>
  <div class="row" style="align-items:center;gap:18px;margin-bottom:14px">
    <div class="beat" id="beat">beat</div>
    <div>
      <div class="mono" id="s-bpm" style="font-size:22px">— BPM</div>
      <div class="mini" style="font-size:11px;color:var(--dim)" id="s-lock">no tempo lock</div>
    </div>
    <div style="flex:1 1 220px">
      <div class="hits">
        <div class="hit-led" id="h-kick">kick</div>
        <div class="hit-led" id="h-snare">snare</div>
        <div class="hit-led" id="h-hat">hat</div>
      </div>
    </div>
  </div>
  <div id="bands"></div>
  <div class="note" id="s-music"></div>
</div>

<div class="panel">
  <h2>Fixtures</h2>
  <div class="row" style="margin-bottom:12px">
    <button id="b-clear">Release all overrides</button>
    <button data-group-all="1">Select all</button>
    <span id="group-buttons" class="row" style="gap:8px"></span>
  </div>
  <div class="grid" id="fixtures"></div>
  <div class="note">
    A fixture with an override is outlined and ignores the looks until released.
  </div>
</div>

</div>
<script src="/static/app.js"></script>
</body>
</html>

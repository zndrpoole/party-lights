# THE PATCH — which lights exist and where they answer on the DMX line.
#
# Adding more lights is an edit here and nothing else. For more of a model we
# already have, bump `count` and check the addresses below it still fit. For a
# new model, drop a profile into config/profiles/ and add an entry.
#
# An entry with `count` is a bank: ids get a numeric suffix (par1, par2, ...)
# counting from `first` (default 1), and addresses step by the profile's
# footprint from `address`.
#
# Current usage: 14 x 7ch = 98, plus 10ch = 108 channels used, 1..115 of 512
# (15..21 is par3's, free while it's out). Lots of room.
#
# `position` is assigned automatically in patch order and is what chases use as
# physical order — so list the PARs in the order they are actually arranged
# around the room, left to right. Getting this wrong makes a chase look like
# random flashing instead of movement.

fixtures:
  - id: par
    profile: zq01104
    count: 2
    address: 1          # par1, par2 at 1, 8
    groups: [pars, rgb]
    label: "PAR"

  # par3 (address 15) is out of the show for now: it's set off to the side.
  # Uncomment to bring it back between par2 and par4.
  # - id: par3
  #   profile: zq01104
  #   address: 15
  #   groups: [pars, rgb]
  #   label: "PAR 3"

  - id: par
    profile: zq01104
    count: 9
    first: 4
    address: 22         # par4..par12 at 22, 29, 36, 43, 50, 57, 64, 71, 78
    groups: [pars, rgb]
    label: "PAR"

  - id: accent
    profile: zq01430
    address: 85
    groups: [accent, uv, bass]   # bass: follows the kick; see the engine's _bass_wash
    label: "RGBWA+UV Accent"

  # par13-15: on the fascia board of the house's east face, ~10 ft up. They
  # continue the PAR numbering but can't join the bank above, whose next step
  # (85) is the accent, so each is its own entry after it. In chase order they
  # follow par12 (east wall, south end) and run south -> north: par13 is the
  # southernmost.
  - id: par13
    profile: zq01104
    address: 95
    groups: [pars, rgb, fascia]
    label: "PAR 13"
  - id: par14
    profile: zq01104
    address: 102
    groups: [pars, rgb, fascia]
    label: "PAR 14"
  - id: par15
    profile: zq01104
    address: 109
    groups: [pars, rgb, fascia]
    label: "PAR 15"
